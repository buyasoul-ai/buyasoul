services:
  - type: web
    name: omnirouter
    runtime: docker
    plan: free
    dockerfilePath: ./omnirouter-service/Dockerfile
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: OMNIROUTE_REMOTE
        value: "true"
      - key: NVIDIA_API_KEY
        value: <set-via-render-dashboard>
      - key: OPENAI_API_KEY
        value: <set-via-render-dashboard>
      - key: ANTHROPIC_API_KEY
        value: <set-via-render-dashboard>
      - key: GOOGLE_API_KEY
        value: <set-via-render-dashboard>
      - key: GROQ_API_KEY
        value: <set-via-render-dashboard>
      - key: OPENROUTER_API_KEY
        value: <set-via-render-dashboard>
